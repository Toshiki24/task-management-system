# バックエンドAPI(Lambda)のデプロイ。設計: aws-architecture.md 8章・4.9、security-review-2.md SEC2-05。
# main への push(backend 変更時)で、イメージをビルドして ECR にプッシュし、Lambda のイメージを更新する。
# AWS 認証は GitHub OIDC(一時的な認証情報)。アクセスキーは保存しない。
#
# 必要な GitHub Variables(Settings > Secrets and variables > Actions > Variables):
#   AWS_ROLE_ARN         … terraform output github_actions_role_arn
#   AWS_REGION           … ap-northeast-1
#   ECR_REPOSITORY       … task-management-system-api(terraform output ecr_repository_url の末尾のリポジトリ名)
#   API_LAMBDA_NAME      … task-management-system-prod-api
#   MIGRATION_LAMBDA_NAME… task-management-system-prod-migration

name: Deploy API (Lambda)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

# 最小権限: OIDC トークンの発行と、チェックアウトの読み取りのみ(SEC2-05)
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: ビルド・ECRプッシュ・Lambda更新
    runs-on: ubuntu-latest
    steps:
      # Actions はコミットSHAで固定する(SEC2-05)。更新は Dependabot(github-actions)が追従する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 一時デバッグ: OIDC トークンの claim(sub/aud 等)だけを出力して、信頼ポリシーの sub と突き合わせる。
      # トークン全体は出力しない。原因特定後にこのステップは削除する。
      - name: Debug OIDC claims (temporary)
        run: |
          IDT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$IDT" | cut -d'.' -f2)
          case $((${#PAYLOAD} % 4)) in 2) PAYLOAD="$PAYLOAD==" ;; 3) PAYLOAD="$PAYLOAD=" ;; esac
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_owner, ref, workflow_ref}'

      - name: AWS 認証(OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR にログイン
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: イメージのビルドとプッシュ
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" backend
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: API用 Lambda の更新
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.API_LAMBDA_NAME }}" \
            --image-uri "$IMAGE_URI" \
            --publish

      - name: マイグレーション用 Lambda の更新(同じイメージ)
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.MIGRATION_LAMBDA_NAME }}" \
            --image-uri "$IMAGE_URI" \
            --publish
